; =====================================================================
; Configuracao do app_clientes
; Copie este arquivo como "clientes.ini" para:
;   - a pasta da solution/target (para rodar pela IDE)
;   - a pasta do executavel (para rodar o .exe)
; NAO versionar o clientes.ini (pode conter senha) - ele esta no .gitignore.
; =====================================================================

[App]
; Modo de acesso aos dados:
;   sqlserver = banco real (secao [Database])
;   mock      = arquivo JSON local, sem banco (para desenvolver/testar sem SQL Server)
Modo=mock
; Caminho do JSON do mock (relativo a pasta deste .ini, ou absoluto)
ArquivoMock=dados\clientes.json

[Database]
; Usado somente com Modo=sqlserver.
; Se a conexao falhar, crie um Database Profile na IDE (Database Painter),
; teste a conexao e copie os valores da aba "Preview" para ca.
DBMS=MSOLEDBSQL SQL Server
ServerName=localhost
Database=pb_clientes

; Autenticacao do Windows (padrao): deixe LogId/LogPass vazios
LogId=
LogPass=
DBParm=TrustedConnection=1

; Autenticacao do SQL Server: preencha LogId/LogPass e deixe DBParm vazio
; LogId=usuario
; LogPass=senha
; DBParm=
